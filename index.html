<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue components</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="nav-bar"></div>

      <h1>{{ intro }}</h1>

      <h2>Add a new book to the list:</h2>
      <input v-model="id" placeholder="Enter book name" />
      <br/>
      <input v-model="title" placeholder="Enter book title" />
      <br/>
      <input v-model="author" placeholder="Enter book author" />
      <br/>
      <input v-model="published" placeholder="Enter book published year" />
      <br/>
      <button @click="AddBook" >Add Book</button>
      <h1>_____________________________</h1>
      <H2>Show all the books</H2>

      <h2>Books List</h2>
      <div>       
        <ul>
          <li v-for="book in books" :key="book.id">
            {{ book.title }} by {{ book.author }} ({{ book.published }})
          </li>
        </ul> 
      </div>
    </div>

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
